name: Idee oder Wunsch
description: Vorschlag für eine neue Funktion oder andere Hardware
labels: ["enhancement"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Was wünschst du dir?
    validations:
      required: true
  - type: textarea
    id: warum
    attributes:
      label: Wofür brauchst du es?
      description: Beschreibe deine Situation, zum Beispiel Luke, Raum, Sensoren.
