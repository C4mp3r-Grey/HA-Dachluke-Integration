name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer ohne v, z. B. 1.15.0 (muss in manifest.json und const.py stehen)"
        required: true
  push:
    tags: ["v*"]

jobs:
  checks:
    uses: ./.github/workflows/validate.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Versionsnummern vergleichen
        run: |
          v="${VERSION#v}"
          echo "V=$v" >> "$GITHUB_ENV"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/dachluke/manifest.json'))['version'])")
          const=$(sed -n 's/^VERSION: Final = "\(.*\)"/\1/p' custom_components/dachluke/const.py)
          echo "Version $v, manifest.json $manifest, const.py $const"
          if [ "$v" != "$manifest" ] || [ "$v" != "$const" ]; then
            echo "::error::Version passt nicht zu manifest.json bzw. const.py"
            exit 1
          fi
      - name: Abschnitt aus CHANGELOG.md
        run: |
          awk -v v="$V" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Siehe CHANGELOG.md" > notes.md
          cat notes.md
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --notes-file notes.md
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
          fi
