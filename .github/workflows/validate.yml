name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # montags: läuft die Integration noch mit der neuesten HA-Version?
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: festgelegte HA-Version
            install: pip install -r requirements_test.txt
            optional: false
          - name: neueste HA-Version
            install: pip install --upgrade pytest-homeassistant-custom-component home-assistant-frontend
            optional: true
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: HA-Version
        run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: pytest
        run: python -m pytest -q -p no:logging

  hassfest:
    name: hassfest (HA-Prüfung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Beschreibung, Themen und Lizenz sind nur für den HACS-Standardkatalog nötig
          ignore: description topics license
